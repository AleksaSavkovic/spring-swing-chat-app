services:
  # Spring Boot backend
  app:
    image: ${CHAT_APP_IMAGE}
    mem_limit: 2g
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TLS_KEYSTORE_PATH: /opt/app/secrets/server-keystore.p12
    ports:
      - "443:8443"
      - "5000:5000"
    volumes:
      - /etc/chat-app/server-keystore.p12:/opt/app/secrets/server-keystore.p12:ro
      - chat-images:/opt/app/images
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL database
  mysql:
    image: mysql:8.4
    mem_limit: 2g
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  chat-images:
