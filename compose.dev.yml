services:
  # Spring boot backend
  app:
    build: .
    mem_limit: 2g
    env_file:
      - .env
    ports:
      - "8443:8443"
      - "5000:5000"
    environment:
      TLS_KEYSTORE_PASSWORD: ${TLS_KEYSTORE_PASSWORD}
    volumes:
      - ./secrets/dev/dev-keystore.p12:/opt/app/secrets/dev-keystore.p12:ro
      - chat-images:/opt/app/images
    depends_on:
      mysql:
        condition: service_healthy

  # MySQL database
  mysql:
    image: mysql:8
    mem_limit: 2g
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # Using 3307 as 3306 is taken for local mysql instance
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}" ]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  chat-images: