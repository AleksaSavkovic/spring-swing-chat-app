spring:
  application:
    name: server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  output:
    ansi:
      enabled: ALWAYS
server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE_PATH}
    key-store-type: PKCS12
    key-store-password: ${TLS_KEYSTORE_PASSWORD}
    key-alias: chat-server
    enabled-protocols:
      - TLSv1.3
      - TLSv1.2
  socket:
    port: ${SOCKET_PORT:5000}
    tls:
      enabled: true
      key-store: ${TLS_KEYSTORE_PATH}
      key-store-password: ${TLS_KEYSTORE_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  upload:
    dir: ${IMAGE_DIR}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION:2592000000}